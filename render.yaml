# OpenPong on Render — the managed split (topology C in docs/DEPLOY.md).
#
# Three services plus one managed Postgres:
#   openpong-api       web (node)     Hono API + CopilotKit runtime + task engine
#   openpong-web       web (node)     Next.js dashboard + BFF
#   openpong-omnipong  pserv (docker) Python/FastAPI domain service (Chromium)
#   openpong-db        Postgres        shared store (replaces the embedded PGlite)
#
# Keep every resource in the same region so the private network resolves.
#
# Wiring references (names must match exactly):
#   openpong-api       <- openpong-web.RENDER_EXTERNAL_URL (ALLOWED_ORIGINS)
#   openpong-web       <- openpong-api.RENDER_EXTERNAL_URL (OPENPONG_SERVER_URL)
#   openpong-api / web <- openpong-omnipong:8000 (private network)
#   openpong-api / web <- openpong-omnipong.OMNIPONG_SERVICE_TOKEN
#   openpong-web       <- openpong-api.OPENMUSE_ACCESS_KEY
#
# What a Blueprint cannot express (see docs/DEPLOY.md):
#   * Private services only get a default TCP health check, so openpong-omnipong
#     has no healthCheckPath.
#   * A service may attach at most one disk, so the domain service keeps its
#     Playwright profiles on the disk and stores data in Postgres.
services:
  # --- Agent server -----------------------------------------------------------
  - type: web
    name: openpong-api
    runtime: node
    # A persistent disk holds DATA_DIR (session-signing key + uploaded files).
    # Attaching a disk keeps this service single-instance and disables
    # zero-downtime deploys; see the scaling notes in docs/DEPLOY.md.
    plan: standard
    buildCommand: pnpm install --frozen-lockfile && pnpm build:server
    startCommand: pnpm start
    healthCheckPath: /api/health
    disk:
      name: openpong-api-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # HOST must be 0.0.0.0 on Render, and the server only allows that in live mode.
      - key: HOST
        value: 0.0.0.0
      - key: WORKSPACE_MODE
        value: live
      - key: AGENT_BACKEND
        value: model
      # Any provider/model your key supports (OpenAI, Anthropic, Google, OpenRouter).
      - key: MODEL
        value: google/gemini-2.5-flash
      - key: DATA_DIR
        value: /var/data/openpong
      - key: TASK_WORKER_ENABLED
        value: "true"
      # Postgres instead of the embedded PGlite store.
      - key: DATABASE_URL
        fromDatabase:
          name: openpong-db
          property: connectionString
      # Hosted accounts. Set to "false" for a single-owner instance.
      - key: MULTI_TENANT
        value: "true"
      # Real tournament registration stays off; a human approval is still required.
      - key: OMNIPONG_ALLOW_REAL_SIGNUP
        value: "false"
      - key: PUBLIC_API_URL
        fromService:
          name: openpong-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_ORIGINS
        fromService:
          name: openpong-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Private-network address of the domain service (Render resolves the
      # service name for services in the same region + workspace).
      - key: OMNIPONG_SERVICE_URL
        value: http://openpong-omnipong:8000
      - key: OMNIPONG_SERVICE_TOKEN
        fromService:
          name: openpong-omnipong
          type: pserv
          envVarKey: OMNIPONG_SERVICE_TOKEN
      - key: OPENMUSE_ACCESS_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # Paste these in the Render Dashboard on first sync.
      - key: OPENAI_API_KEY
        sync: false
      # Optional: enables cross-device chat threads (Rich Threads). Chat and tools
      # work without it; /api/health then reports threadsConfigured: false.
      - key: CPK_INTELLIGENCE_API_KEY
        sync: false
      # Generated by `npx copilotkit@latest project select`; keep it server-only.
      - key: CPK_TELEMETRY_ID
        sync: false

  # --- Domain service (private) ----------------------------------------------
  # Python/FastAPI: ratings, matches, tournaments, league sync, SMS webhook.
  # It bakes Playwright's Chromium, so it cannot be a static site or run on
  # Cloudflare Workers. Private services get a default TCP health check only.
  - type: pserv
    name: openpong-omnipong
    runtime: docker
    plan: standard
    dockerfilePath: ./services/omnipong/Dockerfile
    dockerContext: ./services/omnipong
    # One disk only. Playwright profiles default to ./playwright_data (WORKDIR
    # /app), so persist them here. Drop this disk if you never scrape.
    disk:
      name: openpong-omnipong-profiles
      mountPath: /app/playwright_data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: openpong-db
          property: connectionString
      - key: OMNIPONG_SERVICE_TOKEN
        generateValue: true
      # Tier-3 browser sync + USATT lookup endpoints fail closed without this.
      - key: OPERATOR_TOKEN
        generateValue: true
      # Inbound SMS. Point the Twilio webhook at https://<host>/webhooks/twilio
      # and keep these blank to leave SMS off (the webhook fails closed).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

  # --- Dashboard + BFF --------------------------------------------------------
  - type: web
    name: openpong-web
    runtime: node
    plan: standard
    buildCommand: pnpm install --frozen-lockfile && pnpm --dir apps/web build
    # next start reads $PORT (Render's default is 10000).
    startCommand: pnpm --dir apps/web exec next start
    # A static route that does not depend on the API, so a deploy is not blocked
    # by a transient API hiccup.
    healthCheckPath: /offline
    envVars:
      - key: OPENPONG_SERVER_URL
        fromService:
          name: openpong-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: OMNIPONG_SERVICE_URL
        value: http://openpong-omnipong:8000
      - key: OMNIPONG_SERVICE_TOKEN
        fromService:
          name: openpong-omnipong
          type: pserv
          envVarKey: OMNIPONG_SERVICE_TOKEN
      # Must be identical on every instance: it seals the account bearer into the
      # AES-GCM httpOnly cookie.
      - key: OPENPONG_COOKIE_SECRET
        generateValue: true
      # Single-owner fallback; harmless while MULTI_TENANT is on.
      - key: OPENPONG_ACCESS_KEY
        fromService:
          name: openpong-api
          type: web
          envVarKey: OPENMUSE_ACCESS_KEY

databases:
  - name: openpong-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    # Internal-only: reachable from the Render services above, not the internet.
    ipAllowList: []
